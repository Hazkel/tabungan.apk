name: Build Tabungan APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html script.js style.css www/

      - name: Create Android project
        run: npx cap add android

      - name: Apply Android app icons
        run: |
          set -e

          cp -R tabungan_foto/res/. android/app/src/main/res/

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            icon_dir="android/app/src/main/res/mipmap-${density}"
            cp "${icon_dir}/tabungan.png" "${icon_dir}/ic_launcher.png"
            cp "${icon_dir}/tabungan.png" "${icon_dir}/ic_launcher_round.png"
          done

          cp \
            android/app/src/main/res/mipmap-anydpi-v26/tabungan.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          cp \
            android/app/src/main/res/mipmap-anydpi-v26/tabungan.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabungan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error